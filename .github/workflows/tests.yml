name: Python tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -c "import subprocess, sys; [subprocess.run([sys.executable, '-m', 'pytest', '-q', 'tests/unit/test_audit.py::test_many_writers_on_one_file_keep_a_single_valid_chain'], check=True) for _ in range(10)]"
      - run: python -m compileall -q core adapters tests examples
      - run: python examples/local_stress_demo.py
      - run: git diff --check

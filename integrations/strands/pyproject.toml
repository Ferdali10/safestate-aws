[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safestate-strands-integration"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "bedrock-agentcore>=1.18.1,<2.0.0",
    "aws-opentelemetry-distro~=0.21.0",
    "strands-agents>=1.15.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

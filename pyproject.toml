[project]
name = "safestate-aws"
version = "0.1.0"
description = "Mission-aware governance core for autonomous AWS agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core", "examples"]
addopts = "-ra"
